<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给小雅</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #ffd9e4 0%, #fff5f7 55%, #ffeef3 100%);
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
  }

  /* ===== 主页面（第二幕） ===== */
  #main { display:none; flex-direction:column; align-items:center; width:100%; height:100%; }
  #avatarMain {
    margin-top: 8vh; width:150px; height:150px; border-radius:50%;
    border:4px solid #ffb3c6; object-fit:cover; display:block;
    box-shadow: 0 10px 30px rgba(231,84,128,.28);
    animation: floaty 3.4s ease-in-out infinite alternate;
  }
  @keyframes floaty { from { transform: translateY(0); } to { transform: translateY(-7px); } }
  #titleMain {
    margin-top: 26px; padding: 0 26px; text-align:center;
    font-size: 24px; font-weight: bold; color:#d81b60; line-height: 1.45;
  }
  #descMain { margin-top: 10px; font-size: 15px; color:#ad1457; opacity:.75; }
  .stage { position: relative; width: 100%; flex: 1; }
  .btn {
    position:absolute; border:none; border-radius:999px; cursor:pointer;
    font-family:inherit; font-weight:bold; white-space:nowrap;
    transition: left .16s ease, top .16s ease;
  }
  #yesBtn { background:#ff5c8a; color:#fff; font-size:17px; padding:13px 28px; box-shadow:0 6px 20px rgba(255,92,138,.4); }
  #noBtn  { background:#ececec; color:#777;  font-size:15px; padding:11px 22px; }

  /* ===== 弹窗（第一/三/四幕） ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(60, 10, 30, .45);
    display: none; align-items: center; justify-content: center;
    padding: 22px;
  }
  .overlay.show { display: flex; }
  .card {
    background: #fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><text x="6" y="42" font-size="30" fill="%23ffd9e4">♥</text></svg>');
    border-radius: 20px; padding: 30px 26px 26px;
    max-width: 340px; width: 100%; text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.3);
    animation: pop .35s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(.8); opacity:0; } to { transform: scale(1); opacity:1; } }
  .card img.round {
    width:110px; height:110px; border-radius:50%; object-fit:cover;
    border:3px solid #ffb3c6; margin-bottom: 14px;
  }
  .card h2 { font-size: 24px; color:#d81b60; margin-bottom: 12px; }
  .card .poem { font-size: 15.5px; color:#555; line-height: 1.9; white-space: pre-line; }
  .card .big { font-size: 21px; color:#d81b60; font-weight: bold; line-height: 1.5; }
  .card .sub { margin-top: 10px; font-size: 15px; color:#666; line-height: 1.6; }
  .card button {
    margin-top: 22px; border:none; border-radius: 999px; cursor:pointer;
    background:#ff5c8a; color:#fff; font-family:inherit; font-weight:bold;
    font-size: 16px; padding: 11px 30px; box-shadow: 0 5px 16px rgba(255,92,138,.4);
  }
  .card input {
    margin-top: 16px; width: 100%; padding: 12px 14px;
    border: 2px solid #ffb3c6; border-radius: 12px;
    font-size: 16px; font-family: inherit; outline: none; color:#333;
    background: rgba(255,255,255,.9);
  }
  .card input:focus { border-color: #ff5c8a; }

  /* ===== 结尾（简单收尾） ===== */
  #endScreen {
    position: fixed; inset: 0; z-index: 15; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #ffd9e4 0%, #fff5f7 60%, #ffeef3 100%);
  }
  #endScreen .heart { font-size: 64px; animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 30% { transform: scale(1.15); } }
  #endScreen .line { margin-top: 18px; font-size: 19px; color:#d81b60; letter-spacing: 2px; }
</style>
</head>

  function play(name) {
    try { const a = SFX[name]; a.currentTime = 0; a.play(); } catch (e) {}
  }

  /* ================= 元素 ================= */
  const $ = id => document.getElementById(id);
  const main = $('main'), stage = $('stage');
  const yesBtn = $('yesBtn'), noBtn = $('noBtn');

  $('introTitle').textContent = CONFIG.introTitle;
  $('introDesc').textContent = CONFIG.introDesc;
  $('introBtn').textContent = CONFIG.btnIntro;
  $('titleMain').innerText = CONFIG.title;
  $('descMain').textContent = CONFIG.desc;
  yesBtn.textContent = CONFIG.btnYes;
  noBtn.textContent = CONFIG.btnNo;
  $('questionText').textContent = CONFIG.question;
  $('replyBtn').textContent = CONFIG.btnReply;
  $('messText').innerText = CONFIG.mess;
  $('messDesc').textContent = CONFIG.messDesc;
  if (!CONFIG.messDesc) $('messDesc').style.display = 'none';
  $('acceptBtn').textContent = CONFIG.btnAccept;

  /* ================= 第一幕 → 第二幕 ================= */
  $('introBtn').addEventListener('click', () => {
    play('tick');
    $('introModal').classList.remove('show');
    main.style.display = 'flex';
    placeButtons();
  });

  function placeButtons() {
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const y = sh * 0.35;
    const yw = yesBtn.offsetWidth, nw = noBtn.offsetWidth;
    const total = yw + nw + 36;
    yesBtn.style.left = ((sw - total) / 2) + 'px';
    yesBtn.style.top = y + 'px';
    noBtn.style.left = ((sw - total) / 2 + yw + 36) + 'px';
    noBtn.style.top = (y + 2) + 'px';
  }

  /* ================= 第二幕：拒绝按钮 —— 换位 / 瞬移 两招轮换 ================= */
  let dodgeCount = 0;
  function swapButtons() {
    play('duck');
    const yl = yesBtn.style.left, yt = yesBtn.style.top;
    yesBtn.style.left = noBtn.style.left; yesBtn.style.top = noBtn.style.top;
    noBtn.style.left = yl; noBtn.style.top = yt;
  }
  function teleport() {
    play('swish');
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const x = Math.random() * Math.max(10, sw - noBtn.offsetWidth - 8);
    const y = Math.random() * Math.max(10, sh - noBtn.offsetHeight - 8);
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  }
  function dodge(e) {
    if (e) e.preventDefault();
    if (Math.random() < 0.5 || dodgeCount === 1) swapButtons();
    else teleport();
    dodgeCount++;
  }
  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('touchstart', dodge, { passive: false });
  noBtn.addEventListener('click', dodge);

  /* ================= 第三幕：点同意 → 问题弹窗 + 强制输入梗 ================= */
  yesBtn.addEventListener('click', () => {
    play('tick');
    $('questionModal').classList.add('show');
    setTimeout(() => $('reasonInput').focus(), 60);
  });
  // 招牌名场面：不管打什么，输入框都会逐字变成预设情话
  const reasonInput = $('reasonInput');
  reasonInput.addEventListener('input', () => {
    const len = reasonInput.value.length;
    if (len > CONFIG.reply.length) reasonInput.value = '';
    else reasonInput.value = CONFIG.reply.substring(0, len);
  });

  $('replyBtn').addEventListener('click', () => {
    play('tick');
    $('questionModal').classList.remove('show');
    $('finalModal').classList.add('show');
  });

  /* ================= 第四幕 → 简单收尾 ================= */
  $('acceptBtn').addEventListener('click', () => {
    play('tick');
    $('finalModal').classList.remove('show');
    main.style.display = 'none';
    $('endScreen').style.display = 'flex';
  });
</script>
